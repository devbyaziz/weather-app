<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaca hari ini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#172033',
                        paper: '#f5f7fb',
                        sky: '#2c6bed',
                        mist: '#e8eef9'
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, h3, button { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-paper text-ink">
    <div id="root"></div>
    <script src="config.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useEffect, useState } = React;
        const API_URL = CONFIG.API_BASE_URL;

        const weatherLabels = {
            '01': 'Cerah', '02': 'Berawan sebagian', '03': 'Mendung',
            '04': 'Mendung tebal', '09': 'Hujan', '10': 'Hujan ringan',
            '11': 'Badai petir', '13': 'Salju', '50': 'Berkabut'
        };

        function Icon({ name, size = 20, className = '' }) {
            const paths = {
                search: <><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></>,
                pin: <><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" /><circle cx="12" cy="10" r="2.5" /></>,
                locate: <><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /></>,
                wind: <><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7" /></>,
                drop: <path d="M12 3.5S6 10 6 14a6 6 0 0 0 12 0c0-4-6-10.5-6-10.5Z" />,
                eye: <><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" /><circle cx="12" cy="12" r="2.5" /></>,
                sunrise: <><path d="M3 18h18M5 14a7 7 0 0 1 14 0M12 3v3M4.5 6.5l2 2M19.5 6.5l-2 2" /></>,
                refresh: <><path d="M20 11a8 8 0 0 0-14.5-4L3 10" /><path d="M3 5v5h5M4 13a8 8 0 0 0 14.5 4L21 14" /><path d="M21 19v-5h-5" /></>,
                arrow: <path d="m9 18 6-6-6-6" />
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}>{paths[name]}</svg>;
        }

        const formatDate = date => date.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        const formatDay = date => date.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
        const formatTime = timestamp => new Date(timestamp * 1000).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        function App() {
            const [cityInput, setCityInput] = useState('');
            const [weather, setWeather] = useState(null);
            const [forecast, setForecast] = useState([]);
            const [unit, setUnit] = useState('C');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [recent, setRecent] = useState(() => JSON.parse(localStorage.getItem('recentCities') || '[]'));

            const saveRecent = city => {
                const next = [city, ...recent.filter(item => item.toLowerCase() !== city.toLowerCase())].slice(0, 4);
                setRecent(next);
                localStorage.setItem('recentCities', JSON.stringify(next));
            };

            const loadWeather = async (query, byCoords = false) => {
                setLoading(true);
                setError('');
                try {
                    const params = byCoords ? `lat=${query.lat}&lon=${query.lon}` : `q=${encodeURIComponent(query)}`;
                    const options = `appid=${CONFIG.API_KEY}&units=metric&lang=id`;
                    const [currentResponse, forecastResponse] = await Promise.all([
                        fetch(`${API_URL}/weather?${params}&${options}`),
                        fetch(`${API_URL}/forecast?${params}&${options}`)
                    ]);
                    if (!currentResponse.ok) {
                        if (currentResponse.status === 404) throw new Error('Kota tidak ditemukan. Coba nama kota lain.');
                        if (currentResponse.status === 401) throw new Error('API key tidak valid. Periksa file config.js.');
                        throw new Error('Data cuaca sedang tidak tersedia.');
                    }
                    const current = await currentResponse.json();
                    const forecastData = await forecastResponse.json();
                    setWeather(current);
                    setForecast(forecastData.list.filter(item => item.dt_txt.includes('12:00:00')).slice(0, 5));
                    saveRecent(current.name);
                } catch (requestError) {
                    setError(requestError.message || 'Terjadi kesalahan saat mengambil data.');
                } finally {
                    setLoading(false);
                }
            };

            const search = event => {
                event?.preventDefault();
                const city = cityInput.trim();
                if (!city) return setError('Tulis nama kota terlebih dahulu.');
                loadWeather(city);
            };

            const useLocation = () => {
                if (!navigator.geolocation) return setError('Browser ini tidak mendukung lokasi.');
                setLoading(true);
                navigator.geolocation.getCurrentPosition(
                    position => loadWeather({ lat: position.coords.latitude, lon: position.coords.longitude }, true),
                    () => { setLoading(false); setError('Lokasi tidak dapat diakses. Coba cari kota secara manual.'); }
                );
            };

            useEffect(() => { loadWeather('Jakarta'); }, []);

            const temperature = value => {
                const converted = unit === 'C' ? value : (value * 9 / 5) + 32;
                return `${Math.round(converted)}°`;
            };

            return (
                <main className="mx-auto min-h-screen max-w-6xl px-5 py-8 sm:px-8 lg:py-12">
                    <header className="mb-10 flex items-start justify-between gap-6">
                        <div>
                            <h1 className="text-3xl font-bold tracking-tight sm:text-4xl">Cuaca</h1>
                        </div>
                        <div className="flex items-center gap-1 rounded-full border border-slate-200 bg-white p-1 text-sm font-semibold shadow-sm">
                            {['C', 'F'].map(option => <button key={option} onClick={() => setUnit(option)} className={`rounded-full px-3 py-1.5 transition ${unit === option ? 'bg-ink text-white' : 'text-slate-500 hover:text-ink'}`}>°{option}</button>)}
                        </div>
                    </header>

                    <section className="mb-8 grid gap-4 lg:grid-cols-[1fr_auto]">
                        <form onSubmit={search} className="flex items-center rounded-2xl border border-slate-200 bg-white p-2 shadow-sm focus-within:border-sky focus-within:ring-4 focus-within:ring-sky/10">
                            <Icon name="search" className="ml-3 text-slate-400" />
                            <input value={cityInput} onChange={event => setCityInput(event.target.value)} placeholder="Cari kota..." className="min-w-0 flex-1 bg-transparent px-3 py-3 text-base outline-none placeholder:text-slate-400" />
                            <button className="rounded-xl bg-sky px-5 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 active:scale-95">Cari</button>
                        </form>
                        <button onClick={useLocation} className="flex items-center justify-center gap-2 rounded-2xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-ink shadow-sm transition hover:border-sky hover:text-sky"><Icon name="locate" size={18} /> Pakai lokasi saya</button>
                    </section>

                    {recent.length > 0 && <div className="mb-8 flex flex-wrap items-center gap-2 text-sm text-slate-500"><span className="mr-1">Terakhir dilihat</span>{recent.map(city => <button key={city} onClick={() => { setCityInput(city); loadWeather(city); }} className="rounded-full border border-slate-200 bg-white px-3 py-1.5 transition hover:border-sky hover:text-sky">{city}</button>)}</div>}

                    {error && <div className="mb-8 flex items-center justify-between gap-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"><span>{error}</span><button onClick={() => setError('')} aria-label="Tutup pesan">×</button></div>}
                    {loading && <div className="rounded-3xl border border-slate-200 bg-white p-12 text-center shadow-sm"><div className="mx-auto mb-4 h-7 w-7 animate-spin rounded-full border-2 border-slate-200 border-t-sky"></div><p className="text-sm text-slate-500">Mengambil data cuaca...</p></div>}

                    {!loading && weather && <div className="space-y-5">
                        <section className="grid overflow-hidden rounded-3xl bg-ink text-white shadow-xl shadow-slate-300/40 lg:grid-cols-[1.25fr_1fr]">
                            <div className="relative p-7 sm:p-10">
                                <div className="relative">
                                    <div className="mb-14 flex items-center gap-2 text-slate-300"><Icon name="pin" size={18} /><span>{weather.name}, {weather.sys.country}</span></div>
                                    <p className="mb-2 text-sm text-slate-400">{formatDate(new Date())}</p>
                                    <div className="flex items-center gap-5">
                                        <img className="h-24 w-24 object-contain sm:h-28 sm:w-28" src={`https://openweathermap.org/img/wn/${weather.weather[0].icon}@2x.png`} alt="" />
                                        <div><p className="text-7xl font-semibold tracking-tighter sm:text-8xl">{temperature(weather.main.temp)}</p><p className="mt-2 text-slate-300">Terasa {temperature(weather.main.feels_like)}</p></div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex flex-col justify-between bg-white/5 p-7 sm:p-10">
                                <div><p className="text-2xl font-semibold capitalize">{weather.weather[0].description}</p><p className="mt-2 text-slate-400">Maks {temperature(weather.main.temp_max)} <span className="mx-2">·</span> Min {temperature(weather.main.temp_min)}</p></div>
                            </div>
                        </section>

                        <section className="grid gap-5 lg:grid-cols-[1fr_1.7fr]">
                            <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"><div className="mb-5 flex items-center justify-between"><h2 className="text-lg font-semibold">Ringkasan</h2><button onClick={() => loadWeather(weather.name)} className="text-slate-400 transition hover:text-sky" title="Perbarui"><Icon name="refresh" size={18} /></button></div><div className="grid grid-cols-2 gap-3">
                                {[[`Angin`, `${weather.wind.speed} m/s`, 'wind'], [`Kelembapan`, `${weather.main.humidity}%`, 'drop'], [`Jarak pandang`, `${(weather.visibility / 1000).toFixed(1)} km`, 'eye'], [`Tekanan`, `${weather.main.pressure} hPa`, 'sunrise']].map(([label, value, icon]) => <div key={label} className="rounded-2xl bg-paper p-4"><Icon name={icon} size={18} className="mb-4 text-sky" /><p className="text-xs text-slate-500">{label}</p><p className="mt-1 font-semibold">{value}</p></div>)}</div><div className="mt-3 flex justify-between rounded-2xl bg-paper p-4 text-sm"><span className="text-slate-500">Terbit · <b className="font-medium text-ink">{formatTime(weather.sys.sunrise)}</b></span><span className="text-slate-500">Terbenam · <b className="font-medium text-ink">{formatTime(weather.sys.sunset)}</b></span></div></div>
                            <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"><h2 className="mb-5 text-lg font-semibold">5 hari ke depan</h2><div className="grid grid-cols-2 gap-3 sm:grid-cols-5">{forecast.map(day => <div key={day.dt} className="rounded-2xl border border-slate-100 p-4 transition hover:-translate-y-1 hover:border-sky/40 hover:shadow-md"><p className="text-xs font-semibold uppercase text-slate-500">{formatDay(new Date(day.dt * 1000))}</p><img className="my-4 h-12 w-12 object-contain" src={`https://openweathermap.org/img/wn/${day.weather[0].icon}.png`} alt={day.weather[0].description} /><p className="text-xl font-semibold">{temperature(day.main.temp)}</p><p className="mt-1 truncate text-xs capitalize text-slate-500">{weatherLabels[day.weather[0].icon.slice(0, 2)] || day.weather[0].description}</p></div>)}</div></div>
                        </section>
                    </div>}

                    <footer className="mt-12 border-t border-slate-200 pt-5 text-xs text-slate-400">Data: <a className="text-slate-600 underline decoration-slate-300 underline-offset-2 hover:text-sky" href="https://openweathermap.org" target="_blank" rel="noreferrer">OpenWeatherMap</a></footer>
                </main>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
